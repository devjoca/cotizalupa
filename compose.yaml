services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cotizalupa
      POSTGRES_USER: cotizalupa
      POSTGRES_PASSWORD: cotizalupa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotizalupa -d cotizalupa"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Local S3-compatible bucket. MinIO stopped publishing images, so RustFS
  # stands in; the app reaches it through the same S3 API as Railway's bucket.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: cotizalupa-local
      RUSTFS_SECRET_KEY: cotizalupa-local-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: cotizalupa-local
      AWS_SECRET_ACCESS_KEY: cotizalupa-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket cotizalupa 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket cotizalupa; do sleep 1; done

volumes:
  postgres-data:
  rustfs-data:
