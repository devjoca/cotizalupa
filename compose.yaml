services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cotizalupa
      POSTGRES_USER: cotizalupa
      POSTGRES_PASSWORD: cotizalupa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotizalupa -d cotizalupa"]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cotizalupa-local
      MINIO_ROOT_PASSWORD: cotizalupa-local-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 cotizalupa-local
        cotizalupa-local-secret; do sleep 1; done;
        mc mb --ignore-existing local/cotizalupa

volumes:
  postgres-data:
  minio-data:
